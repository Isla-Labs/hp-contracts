# HighPotential protocol deployments config (forge-std Config).
# Preconfig externals are seeded onto AddressProvider before InitGuard deploy/init.
# Protocol output addresses are written back on broadcast by DeployAll.

[84532]
endpoint_url = "${BASE_SEPOLIA_RPC_URL}"

[84532.bool]
is_testnet = true

[84532.address]
# DAO / ops
hp_treasury = "0x7Ca4d3C95b4A843aeD5C14e356973fCD400c5d00"
