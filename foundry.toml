[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.34"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 0
bytecode_hash = "none"
gas_limit = "8000000000"
create2_deployer = "0x4e59b44847b379578588920ca78fbf26c0b4956c"
fs_permissions = [
  { access = "read", path = "./lib" },
  { access = "read", path = "./script" },
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "./deployments.config.toml" },
]

[fuzz]
max_test_rejects = 10000000
runs = 32

[fmt]
bracket_spacing = true
int_types = "long"
line_length = 120
multiline_func_header = "params_first_multi"
number_underscore = "thousands"
quote_style = "double"
tab_width = 4
wrap_comments = false

[invariant]
depth = 512
show_metrics = true
fail_on_revert = true

# Solar fails to resolve Doppler's bare `src/` imports even with context
# remappings / lint.ignore. Disable lint-on-build until Foundry catches up.
[lint]
ignore = ["lib/**"]
lint_on_build = false

[etherscan]
etherscan = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
base = { key = "${ETHERSCAN_API_KEY}" }
base_sepolia = { key = "${ETHERSCAN_API_KEY}" }

[rpc_endpoints]
ethereum = "${ETHEREUM_MAINNET_RPC_URL}"
ethereum_sepolia = "${ETHEREUM_SEPOLIA_RPC_URL}"
base = "${BASE_MAINNET_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"